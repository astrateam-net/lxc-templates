---
# Generated by: mise run render coder-base — DO NOT EDIT.
# coder-base — Proxmox CT gold image. Source template; render -> coder-base.yaml.

image:
  distribution: debian
  release: trixie
  architecture: amd64
  variant: default
  name: coder-base-debian-trixie-amd64
  description: |-
    Coder LXC workspace base ({{ image.distribution }} {{ image.release }})
  serial: "13.0.4" # base-major.minor.patch — major = base distro (13 = Debian 13)
  expiry: 30d

source:
  downloader: debootstrap
  same_as: sid # trixie debootstrap script may be absent on the runner; sid's works
  url: https://deb.debian.org/debian/
  keyserver: keyserver.ubuntu.com
  # Debian 13 (trixie) keyring. Trixie is now stable, so its InRelease is signed
  # by the Stable Release Key — debootstrap fails without it (unknown key
  # 762F67A0B2C39DE4). Keep all three so both the source signature and later apt
  # operations validate.
  keys:
    - 0x41587F7DB8C774BCCF131416762F67A0B2C39DE4 # Debian Stable Release Key (13/trixie)
    - 0x04B54C3CDCA79751B16BC6B5225629DF75B188BD # Debian Archive Automatic Signing Key (13/trixie)
    - 0x5E04A1E3223A19A20706E20F9904613D4CCE68C6 # Debian Security Archive Automatic Signing Key (13/trixie)

targets:
  lxc:
    create_message: |-
      Coder workspace base ({{ image.description }}).
    config:
      - type: all
        before: 5
        content: |-
          lxc.include = LXC_TEMPLATE_CONFIG/debian.common.conf
      - type: user
        before: 5
        content: |-
          lxc.include = LXC_TEMPLATE_CONFIG/debian.userns.conf
      - type: all
        after: 4
        content: |-
          lxc.include = LXC_TEMPLATE_CONFIG/common.conf
      - type: user
        after: 4
        content: |-
          lxc.include = LXC_TEMPLATE_CONFIG/userns.conf
      - type: all
        content: |-
          lxc.arch = {{ image.architecture_personality }}

files:
  - path: /etc/hostname
    generator: hostname
  - path: /etc/hosts
    generator: hosts
  - path: /etc/mise/config.toml
    generator: dump
    content: |-
      [tools]
      node = "24"
      gh = "2.96.0"
      glab = "1.109.0"
      # Not in the mise registry — github backend reads the goreleaser assets directly and
      # verifies the release's GitHub artifact attestations, which upstream's curl|sh does not.
      "github:Infisical/agent-vault" = "0.39.0"
  - path: /etc/profile.d/mise.sh
    generator: dump
    mode: "0755"
    content: |-
      # shellcheck shell=sh
      if [ -n "${PS1:-}" ] && command -v mise >/dev/null 2>&1; then
        eval "$(mise activate bash)"
      fi
  - path: /etc/systemd/system/coder-agent.service
    generator: dump
    content: |-
      [Unit]
      Description=Coder Agent
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=coder
      EnvironmentFile=/opt/coder/init.env
      ExecStart=/opt/coder/init
      Restart=always
      RestartSec=10

      [Install]
      WantedBy=multi-user.target

packages:
  manager: apt
  update: true
  cleanup: true
  sets:
    - packages:
        - ca-certificates
        - curl
        - sudo
        - git
        - jq
        - python3
        - openssh-client
        - locales
      action: install
    - packages:
        - build-essential
        - pkg-config
        - wget
        - gnupg
        - unzip
        - zip
        - xz-utils
        - rsync
        - file
        - tree
        - less
        - vim
        - htop
        - tmux
        - ripgrep
        - fd-find
        - man-db
        - bash-completion
      action: install
    - packages:
        - libssl-dev
        - zlib1g-dev
        - libbz2-dev
        - libreadline-dev
        - libsqlite3-dev
        - libffi-dev
        - liblzma-dev
      action: install
    - packages:
        - systemd-sysv
        - dbus
      action: install
    # iptables for egress rules; uidmap for newuidmap/newgidmap (userns id mapping).
    - packages:
        - iptables
        - uidmap
      action: install
    # t64 names required on Debian 13 (libgtk/libasound/libatk-bridge/libatspi).
    - packages:
        - xvfb
        - xauth
        - dbus-x11
        - libgtk-3-0t64
        - libnss3
        - libgbm1
        - libasound2t64
        - libatk-bridge2.0-0t64
        - libatspi2.0-0t64
        - libdrm2
        - libxcomposite1
        - libxdamage1
        - libxfixes3
        - libxkbcommon0
        - libxrandr2
        - libxss1
      action: install
  repositories:
    - name: sources.list
      url: |-
        deb https://deb.debian.org/debian {{ image.release }} main contrib non-free non-free-firmware
        deb https://deb.debian.org/debian {{ image.release }}-updates main contrib non-free non-free-firmware
        deb https://security.debian.org/debian-security {{ image.release }}-security main contrib non-free non-free-firmware

actions:
  - trigger: post-packages
    action: |-
      #!/bin/sh
      set -eux

      sed -i 's/^# *en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' /etc/locale.gen
      locale-gen
      update-locale LANG=en_US.UTF-8

      # baked into the image = every clone shares this passwordless-sudo user (dev workspaces)
      getent group sudo >/dev/null 2>&1 || groupadd --system sudo
      id coder >/dev/null 2>&1 || useradd --create-home -s /bin/bash -u 1000 -G sudo coder
      printf 'coder ALL=(ALL) NOPASSWD:ALL\n' > /etc/sudoers.d/coder
      chmod 0440 /etc/sudoers.d/coder
  - trigger: post-packages
    action: |-
      #!/bin/sh
      set -eux

      # Bare debootstrap leaves systemd-networkd-wait-online.service enabled by preset,
      # but this image uses ifupdown (networking.service owns eth0); systemd-networkd
      # itself stays disabled. An enabled wait-online with no running networkd blocks
      # network-online.target for its full 120s timeout on every boot, which delays
      # coder-agent.service (After=network-online.target) by ~2 minutes. ifupdown's own
      # ifupdown-wait-online.service already satisfies the target in ~1s. The stock
      # debian-13-standard Proxmox template masks this unit; match that.
      ln -sf /dev/null /etc/systemd/system/systemd-networkd-wait-online.service
  # post-files: /etc/mise/config.toml is written by then, so `mise install` reads node=24 from it
  - trigger: post-files
    action: |-
      #!/bin/sh
      set -eux

      # MISE_DATA_DIR routes BOTH installs and shims under a system path:
      #   installs -> /usr/local/share/mise/installs  (also mise's default MISE_SYSTEM_INSTALLS_DIR)
      #   shims    -> /usr/local/share/mise/shims      (MISE_SHIMS_DIR defaults to $MISE_DATA_DIR/shims)
      # mise scans /usr/local/share/mise/installs unconditionally (env::shared_install_dirs),
      # so tools resolve inside the systemd Coder agent with no MISE_DATA_DIR / no
      # /etc/environment / no login shell. Keep this export — plain `mise install` needs
      # it to land in the system path.
      export MISE_DATA_DIR=/usr/local/share/mise
      curl -fsSL https://mise.run | MISE_INSTALL_PATH=/usr/local/bin/mise sh

      # node version comes from /etc/mise/config.toml (system config, always loaded).
      # `mise install` auto-reshims, so the shims exist before we symlink them.
      mise install
      ln -sf /usr/local/share/mise/shims/* /usr/local/bin/
  - trigger: post-files
    action: |-
      #!/bin/sh
      set -eux

      # The injector only lands /opt/coder/init + init.env (per-workspace); the dir and
      # the enabled unit are baked here.
      install -d -m 0755 /opt/coder
      install -d /etc/systemd/system/multi-user.target.wants
      ln -sf /etc/systemd/system/coder-agent.service \
        /etc/systemd/system/multi-user.target.wants/coder-agent.service

mappings:
  architecture_map: debian
